name: Site checks

on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check website and publication scripts
        run: |
          node --check app.js
          node --check archive.js
          node --check reader.js
          node --check scripts/generate-data.mjs
          node --check scripts/publish-data.mjs
          node --test scripts/tests/*.test.mjs
          node scripts/generate-data.mjs origin/main
          node scripts/check-reader.mjs
          node scripts/check-theme.mjs
