name: Site snapshots

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out website and complete source history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          path: website
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate current main snapshots
        working-directory: website
        run: node scripts/generate-data.mjs origin/main
      - name: Validate website and publication guards
        working-directory: website
        run: |
          node --check app.js
          node --check archive.js
          node --check reader.js
          node --check scripts/generate-data.mjs
          node --check scripts/publish-data.mjs
          node scripts/check-reader.mjs
          node scripts/check-theme.mjs
          node --test scripts/tests/*.test.mjs
          git diff --check
      - name: Upload verified snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-data
          path: |
            website/data/site-data.json
            website/data/recent-commits.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    # Share the docs publisher's lock so both jobs preserve each other's output.
    concurrency:
      group: codeflare-docs-pages
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out Pages branch and complete source history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          path: website
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Download verified snapshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-data
          path: website/data
      - name: Publish snapshots and verify live Pages data
        working-directory: website
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-data.mjs
