<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="./panel-redirect.js"></script>
    <noscript><meta http-equiv="refresh" content="0; url=https://lucius7.dev/oj/code/" /></noscript>
    <link rel="canonical" href="https://lucius7.dev/oj/code/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="CodeFlare · 算法竞赛源码阅读" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)" />
    <title>源码 · CodeFlare</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./vendor/github-light.css" />
    <link rel="stylesheet" href="./vendor/github-dark.min.css" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="./theme.css?v=20260908-avatar" />
    <link rel="stylesheet" href="./reader.css?v=20260908-unified" />
    <script src="./archive.js?v=20260909-readable-paths" defer></script>
    <script src="./vendor/highlight.min.js" defer></script>
    <script src="./reader.js?v=20260908-codeflare" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#code-scroller">跳到代码</a>
    <header class="reader-header">
      <div class="reader-topline site-topbar">
        <a class="brand" href="./#problem-library" aria-label="返回题库" title="返回题库">
          <img class="brand-avatar" src="https://q1.qlogo.cn/g?b=qq&amp;nk=3012967200&amp;s=100" alt="theLucius7 的 QQ 头像" width="36" height="36" decoding="async" referrerpolicy="no-referrer" />
          <span class="brand-name">CodeFlare</span>
        </a>
        <nav class="reader-actions" aria-label="代码操作">
          <a id="reader-problem-link" class="ui-button" target="_blank" rel="noopener noreferrer" hidden>原题 ↗</a>
          <a id="reader-github-link" class="ui-button" target="_blank" rel="noopener noreferrer" hidden>GitHub ↗</a>
          <button id="copy-code" class="ui-button ui-button--primary" type="button" disabled>
            <svg class="stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V4H4v12h4" /></svg>
            <span id="copy-label">复制代码</span>
          </button>
        </nav>
      </div>
      <h1 id="reader-title">源码</h1>
      <div class="reader-file-meta">
        <span id="reader-path" class="file-path">main</span>
        <time id="reader-submitted-at">提交时间未知</time>
      </div>
    </header>

    <main class="reader-workspace" aria-label="源码阅读">
      <div id="reader-state" class="reader-state" role="status" aria-busy="true">
        <span class="state-mark" aria-hidden="true">{ }</span>
        <p id="reader-message">正在载入代码…</p>
        <button id="retry-code" class="ui-button" type="button" hidden>重新载入</button>
      </div>
      <div id="code-scroller" class="code-scroller" tabindex="0" role="region" aria-label="源码，可横向和纵向滚动" hidden>
        <div class="code-grid">
          <div id="line-numbers" class="line-numbers" aria-hidden="true"></div>
          <pre><code id="code-content"></code></pre>
        </div>
      </div>
    </main>

    <footer class="reader-statusbar">
      <span class="file-status"><span class="branch-dot" aria-hidden="true"></span>main <span id="reader-language"></span><span id="reader-lines"></span></span>
      <span id="copy-status" role="status" aria-live="polite"></span>
    </footer>
    <noscript><div class="noscript">需要启用 JavaScript 读取代码。<a href="./#problem-library">返回题库</a></div></noscript>
  </body>
</html>
